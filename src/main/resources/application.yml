server:
  port: 8080

spring:
  application:
    name: music-digging

  datasource:
    url: jdbc:mysql://localhost:3306/music_digging?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  thymeleaf:
    cache: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.musicdigging.domain
  configuration:
    map-underscore-to-camel-case: true

lastfm:
  api-key: ${LASTFM_API_KEY}
  api-url: https://ws.audioscrobbler.com/2.0/
