<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Music Digging</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h1>Music Digging</h1>

<div class="search-box">
    <input type="text" id="keyword" placeholder="가수명 또는 곡명">
    <button id="searchBtn">검색</button>
</div>

<div id="albumModal" class="modal hidden">
    <div class="modal-content">
        <button id="modalCloseBtn">X</button>

        <h2>앨범 상세</h2>
        <div id="albumDetailArea"></div>

        <h2>트랙 목록</h2>
        <div id="trackArea"></div>
    </div>
</div>

<hr>

<h2>검색 결과</h2>
<div id="resultArea"></div>

<h2>아티스트 정보</h2>
<div id="artistArea"></div>

<h2>비슷한 아티스트</h2>
<div id="similarArtistArea"></div>

<h2>앨범 목록</h2>
<div id="albumArea"></div>





<script src="/js/app.js"></script>

</body>
</html>
