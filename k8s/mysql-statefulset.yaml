apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql
  namespace: music-digging

spec:
  serviceName: mysql
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3306

          envFrom:
            - secretRef:
                name: music-digging-secret

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: mysql-data

      spec:
        storageClassName: standard
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi