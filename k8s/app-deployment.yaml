apiVersion: apps/v1
kind: Deployment

metadata:
  name: music-digging-app
  namespace: music-digging

spec:
  replicas: 2

  selector:
    matchLabels:
      app: music-digging-app

  template:
    metadata:
      labels:
        app: music-digging-app

    spec:
      containers:
        - name: music-digging-app
          image: music-digging:1.0.1
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: music-digging-config

          env:
            - name: LASTFM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: music-digging-secret
                  key: LASTFM_API_KEY

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: music-digging-secret
                  key: MYSQL_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: music-digging-secret
                  key: MYSQL_PASSWORD

          ports:
            - containerPort: 8080

          readinessProbe:
                httpGet:
                  path: /actuator/health/readiness
                  port: 8080
                initialDelaySeconds: 10
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 3

          livenessProbe:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3

